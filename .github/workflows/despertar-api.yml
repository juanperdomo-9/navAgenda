# La API está en el plan free de Render: se duerme a los 15 min sin uso y el primero espera ~50 s.
# Esto la visita cada 10 min para que siempre esté despierta (gratis en repos públicos).
name: Mantener la API despierta

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /health de la API y la web
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://navagenda-api.onrender.com/health
          curl -fsS -o /dev/null --max-time 60 https://navagenda-web.onrender.com/
