<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#120c0b" />
<title>Panel · La Navaja</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141210'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='900' font-size='15' text-anchor='middle' fill='%23f6d13a'%3EN%C2%BA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" />
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-hoy" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h4"/></symbol>
  <symbol id="i-barberos" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-tijera" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></symbol>
  <symbol id="i-clientes" viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M7 15c.8-1.8 2.2-2.5 3.5-2.5S13.2 13.2 14 15M17 9h2M17 12h2"/><circle cx="10.5" cy="9.5" r="2"/></symbol>
  <symbol id="i-numeros" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></symbol>
  <symbol id="i-pagina" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
  <symbol id="i-izq" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-der" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-regalo" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
  <symbol id="i-candado" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-salir" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
</svg>

<div class="app">
  <nav class="lado" aria-label="Panel" id="nav-lado"></nav>
  <div>
    <header class="cab">
      <b class="nombre cond">La Navaja</b>
      <a class="ver-pagina" href="../barberia/" target="_blank" rel="noopener">Mi página <svg class="i" aria-hidden="true"><use href="#i-flecha"/></svg></a>
      <div class="tira" role="group" aria-label="Próximo turno de hoy" id="tira"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="abajo" aria-label="Panel" id="nav-abajo"></nav>

<!-- Una sola hoja de edición: el contenido lo arma cada vista -->
<dialog class="hoja" id="hoja" aria-labelledby="hoja-t">
  <div class="h-cab"><h2 class="cond" id="hoja-t"></h2><button type="button" id="hoja-x" aria-label="Cerrar"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <form class="h-cuerpo" id="hoja-form" novalidate></form>
  <div class="h-pie">
    <p class="resumen-h" id="hoja-resumen"></p>
    <p class="estado" id="hoja-estado" role="status" aria-live="polite"></p>
    <div id="hoja-salir" class="confirmar" hidden>
      ¿Salir sin guardar? Vas a perder los cambios.
      <div class="botones"><button class="btn peligro chico" type="button" id="salir-si">Descartar cambios</button><button class="btn sec chico" type="button" id="salir-no">Seguir editando</button></div>
    </div>
    <div class="botones"><button class="btn sec" type="button" id="hoja-cancelar">Cancelar</button><button class="btn" type="submit" form="hoja-form" id="hoja-ok">Guardar</button></div>
  </div>
</dialog>

<div class="aviso" id="aviso" popover="manual" role="status"><span id="aviso-txt"></span><button type="button" id="aviso-btn" hidden>Deshacer</button></div>
<script src="panel.js" defer></script>
</body>
</html>
